name: Remote CPA V1 Windows

on:
  push:
    branches:
      - feature/remote-cpa-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    # The first run patches + commits the real source files. That bot commit
    # triggers another push event; skip it to avoid a build loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Remote CPA V1 source changes
        run: python scripts/apply_remote_cpa_v1.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Format Rust
        run: cargo fmt --all

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Check frontend
        working-directory: apps/desktop
        run: npm run build

      # Bundle the normal CPA core too, even though Remote mode does not start it;
      # this preserves all existing Local-mode behaviour in the preview build.
      - name: Stage CLIProxyAPI core
        shell: pwsh
        run: |
          $ver = "7.2.20"
          $url = "https://github.com/router-for-me/CLIProxyAPI/releases/download/v$ver/CLIProxyAPI_${ver}_windows_amd64.zip"
          $dest = "resources/proxy/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "cpa.zip"
          $ext = Join-Path $env:RUNNER_TEMP "cpa"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $ext -Force
          $bin = Get-ChildItem -Path $ext -Recurse -Filter "cli-proxy-api*.exe" | Select-Object -First 1
          if (-not $bin) { throw "cli-proxy-api.exe not found in CLIProxyAPI archive" }
          Copy-Item $bin.FullName (Join-Path $dest "CLIProxyAPI.exe") -Force

      - name: Stage optional Windows deps
        shell: pwsh
        continue-on-error: true
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/deps"
          New-Item -ItemType Directory -Force -Path "resources/kiro/windows" | Out-Null
          New-Item -ItemType Directory -Force -Path "resources/proxy/windows/plugins" | Out-Null
          Invoke-WebRequest -Uri "$base/kiro-rs.exe" -OutFile "resources/kiro/windows/kiro-rs.exe"
          Invoke-WebRequest -Uri "$base/quotio-key-router.dll" -OutFile "resources/proxy/windows/plugins/quotio-key-router.dll"

      - name: Build Windows EXE
        working-directory: apps/desktop
        shell: pwsh
        env:
          QUOTIO_GEMINI_CLIENT_ID: ${{ secrets.QUOTIO_GEMINI_CLIENT_ID }}
          QUOTIO_GEMINI_CLIENT_SECRET: ${{ secrets.QUOTIO_GEMINI_CLIENT_SECRET }}
          QUOTIO_ANTIGRAVITY_CLIENT_ID: ${{ secrets.QUOTIO_ANTIGRAVITY_CLIENT_ID }}
          QUOTIO_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.QUOTIO_ANTIGRAVITY_CLIENT_SECRET }}
        run: |
          # Forks do not inherit upstream updater signing secrets. Disable updater
          # artifact signing only for this preview build; the normal release
          # workflow remains unchanged.
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 src-tauri/tauri.remote-build.conf.json
          npm run tauri -- build --bundles nsis --config src-tauri/tauri.remote-build.conf.json
          Remove-Item src-tauri/tauri.remote-build.conf.json -ErrorAction SilentlyContinue

      - name: Commit validated source changes to feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/quotio-core/src/lib.rs `
                  crates/quotio-core/src/management.rs `
                  crates/quotio-core/src/remote_codex.rs `
                  crates/quotio-core/src/remote_quota.rs `
                  apps/desktop/src-tauri/src/lib.rs `
                  apps/desktop/src/components/sections/AgentsScreen.tsx
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit"
          } else {
            git commit -m "feat: support remote CPA quotas and Codex launch"
            git push origin HEAD:feature/remote-cpa-v1
          }

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Quotio-Remote-CPA-V1-Windows
          if-no-files-found: error
          path: |
            target/release/*.exe
            target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
