name: Main Windows Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # A successful validation run may commit one-shot source normalization back
    # to main. Skip the bot follow-up push to avoid an Actions loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-shot main patch
        shell: pwsh
        run: |
          if (Test-Path "scripts/apply_main_polish.py") {
            python scripts/apply_main_polish.py
          } else {
            Write-Host "No one-shot patcher present; building current main as-is."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Format Rust
        run: cargo fmt --all

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Check frontend
        working-directory: apps/desktop
        run: npm run build

      # Preserve the original Local Proxy mode in preview builds even though the
      # customized workflow mainly targets Remote CPA usage.
      - name: Stage CLIProxyAPI core
        shell: pwsh
        run: |
          $ver = "7.2.20"
          $url = "https://github.com/router-for-me/CLIProxyAPI/releases/download/v$ver/CLIProxyAPI_${ver}_windows_amd64.zip"
          $dest = "resources/proxy/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "cpa.zip"
          $ext = Join-Path $env:RUNNER_TEMP "cpa"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $ext -Force
          $bin = Get-ChildItem -Path $ext -Recurse -Filter "cli-proxy-api*.exe" | Select-Object -First 1
          if (-not $bin) { throw "cli-proxy-api.exe not found in CLIProxyAPI archive" }
          Copy-Item $bin.FullName (Join-Path $dest "CLIProxyAPI.exe") -Force

      - name: Stage optional Windows deps
        shell: pwsh
        continue-on-error: true
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/deps"
          New-Item -ItemType Directory -Force -Path "resources/kiro/windows" | Out-Null
          New-Item -ItemType Directory -Force -Path "resources/proxy/windows/plugins" | Out-Null
          Invoke-WebRequest -Uri "$base/kiro-rs.exe" -OutFile "resources/kiro/windows/kiro-rs.exe"
          Invoke-WebRequest -Uri "$base/quotio-key-router.dll" -OutFile "resources/proxy/windows/plugins/quotio-key-router.dll"

      - name: Build Windows EXE
        working-directory: apps/desktop
        shell: pwsh
        env:
          QUOTIO_GEMINI_CLIENT_ID: ${{ secrets.QUOTIO_GEMINI_CLIENT_ID }}
          QUOTIO_GEMINI_CLIENT_SECRET: ${{ secrets.QUOTIO_GEMINI_CLIENT_SECRET }}
          QUOTIO_ANTIGRAVITY_CLIENT_ID: ${{ secrets.QUOTIO_ANTIGRAVITY_CLIENT_ID }}
          QUOTIO_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.QUOTIO_ANTIGRAVITY_CLIENT_SECRET }}
        run: |
          # Preview builds deliberately skip updater signing. Tagged releases use
          # release.yml and the repository's own TAURI_SIGNING_* secrets.
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 src-tauri/tauri.main-preview.conf.json
          npm run tauri -- build --bundles nsis --config src-tauri/tauri.main-preview.conf.json
          Remove-Item src-tauri/tauri.main-preview.conf.json -ErrorAction SilentlyContinue

      - name: Commit validated main source changes
        shell: pwsh
        run: |
          # The patcher is one-shot; keep only validated real source changes.
          Remove-Item "scripts/apply_main_polish.py" -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- `
            crates/quotio-core/src/lib.rs `
            apps/desktop/src/i18n.tsx `
            apps/desktop/src/components/sections/SettingsScreen.tsx `
            apps/desktop/src/components/AppShell.tsx `
            apps/desktop/src-tauri/tauri.conf.json `
            .github/workflows `
            scripts
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit"
          } else {
            git commit -m "fix: keep remote CPA Codex config after Quotio exits"
            git push origin HEAD:main
          }

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Quotio-Main-Windows
          if-no-files-found: error
          path: |
            target/release/*.exe
            target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
